name: CI Backend Harmonia

on: [push]

env:
  APP_SECRET: ${{ secrets.APP_SECRET }}
  DATABASE_URL: "mysql://root:${{ secrets.DB_ROOT_PASSWORD }}@127.0.0.1:3306/${{ secrets.DB_NAME }}?serverVersion=10.6.0-MariaDB&charset=utf8mb4"
  DEFAULT_URI: "http://localhost"
  MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
  MAILER_DSN: "null://null"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Créer un .env vide
        run: touch .env

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, intl

      - name: Dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Mise en cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: deps-${{ hashFiles('composer.lock') }}

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Créer un .env vide
        run: touch .env

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, intl

      - name: Récupération du cache
        uses: actions/cache/restore@v4
        with:
          path: vendor
          key: deps-${{ hashFiles('composer.lock') }}

      - name: Lint du YAML
        run: php bin/console lint:yaml config

      - name: Lint des templates Twig
        run: php bin/console lint:twig templates

      - name: Lint de la config des services et du typage
        run: php bin/console lint:container

  phpstan:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Créer un .env vide
        run: touch .env

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, intl

      - name: Récupération du cache
        uses: actions/cache/restore@v4
        with:
          path: vendor
          key: deps-${{ hashFiles('composer.lock') }}

      - name: Analyse statique (PHPStan)
        run: vendor/bin/phpstan analyse

  cs-fixer:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Créer un .env vide
        run: touch .env

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, intl

      - name: Récupération du cache
        uses: actions/cache/restore@v4
        with:
          path: vendor
          key: deps-${{ hashFiles('composer.lock') }}

      - name: Vérification du style de code (PHP CS Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  test:
    needs: [lint, phpstan, cs-fixer]
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      KERNEL_CLASS: 'App\Kernel'
      APP_ENV: test
      FIXTURE_PASSWORD: ${{ secrets.FIXTURE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Créer un .env vide
        run: touch .env

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, intl
          ini-values: variables_order=EGPCS

      - name: Récupérer vendor depuis le cache
        uses: actions/cache/restore@v4
        with:
          path: vendor
          key: deps-${{ hashFiles('composer.lock') }}

      - name: Créer le schéma de la base de test
        run: php bin/console doctrine:schema:create --env=test

      - name: Charger les fixtures
        run: php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Exécution des tests
        run: php bin/phpunit